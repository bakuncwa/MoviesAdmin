# Local SQL Server and Azurite (Azure Blob Storage emulator, for poster uploads) for MoviesAdmin. MSSQL_SA_PASSWORD and MSSQL_PORT come from .env (git-ignored; copy
# .env.example), which scripts/setup-secrets.sh also uses to build the app's connection string in user
# secrets, so the port compose opens and the port the app connects to are always the same value.
#   docker compose up -d        start (waits nothing; check `docker compose ps` for "healthy")
#   docker compose down         stop + remove the container (data survives in the named volume)
#   docker compose down -v      ...and also delete the database and poster volumes
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server only ships amd64 images; pinning the platform runs it under Rosetta on Apple
    # Silicon without the "platform does not match" warning on every start.
    platform: linux/amd64
    container_name: mssql_inet2005_701
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (copy .env.example)}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    # Keeps the MoviesAdmin database across container recreation, so a `docker compose down`
    # doesn't wipe applied migrations and data the way `docker rm` on a volume-less container does.
    volumes:
      - mssql-data:/var/opt/mssql
    # Emulated startup takes ~30-60s before logins succeed; "healthy" means it's safe to run
    # `dotnet ef database update`.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # Poster uploads (Services/PosterStorage/AzureBlobPosterStorage.cs). The app reaches it through
  # AZURE_STORAGE_CONNECTION_STRING="UseDevelopmentStorage=true" in .env, which the Azure SDK maps to
  # http://127.0.0.1:10000/devstoreaccount1, so the blob port is fixed at 10000. The app creates the
  # "posters" container with public read access for blobs, so <img> tags load blobs directly.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite_inet2005_701
    # Blob service only; --skipApiVersionCheck lets a newer Azure.Storage.Blobs SDK talk to it.
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck
    ports:
      - "10000:10000"
    # Uploaded posters survive `docker compose down`, like the database.
    volumes:
      - azurite-data:/data
    restart: unless-stopped

volumes:
  mssql-data:
  azurite-data:
