<svg xmlns="http://www.w3.org/2000/svg" width="282" height="64" viewBox="0 0 282 64" role="img" aria-label="Reelbox Admin">
  <!-- Wordmark for the Auth0 login page (scripts/auth0-branding.sh): the navbar's .brand-mark
       (green-to-brown film badge) followed by "Reelbox" and the accent-green "Admin". -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6b3a"/>
      <stop offset="1" stop-color="#8b5a2b"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="17" fill="url(#mark)"/>
  <!-- Film frame: a strip with sprocket holes down both sides. -->
  <g fill="#ffffff">
    <path fill-rule="evenodd" d="M19 16h26a3 3 0 0 1 3 3v26a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3V19a3 3 0 0 1 3-3Zm6 4v24h14V20H25Zm-5 1v4h3v-4h-3Zm0 9v4h3v-4h-3Zm0 9v4h3v-4h-3Zm21-18v4h3v-4h-3Zm0 9v4h3v-4h-3Zm0 9v4h3v-4h-3Z"/>
  </g>
  <text x="74" y="43" font-family="Outfit, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2b1d14">Reelbox<tspan fill="#2f6b3a">Admin</tspan></text>
</svg>
